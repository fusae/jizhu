name: Build desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build macOS packages
        if: matrix.platform == 'mac'
        run: npm run pack:mac

      - name: Build Windows package
        if: matrix.platform == 'windows'
        run: npm run pack:win

      - name: Upload macOS packages
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: |
            release/*.dmg
            release/*.zip
            release/*.yml
            release/*.blockmap

      - name: Upload Windows package
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --title "记住 $GITHUB_REF_NAME" --generate-notes
