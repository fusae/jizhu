<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JiZhu</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f5f0;
      color: #1a1a1a;
      user-select: none;
    }
    .header {
      padding: 16px 20px;
      background: #fff;
      border-bottom: 1px solid #e5e5dc;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header h1 { font-size: 20px; font-weight: 700; color: #1f4f3a; }
    .header .count { font-size: 14px; color: #888; margin-left: 8px; }
    .add-btn {
      padding: 6px 16px;
      border: none;
      border-radius: 6px;
      background: #1f4f3a;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      font-weight: 600;
    }
    .add-btn:hover { background: #183f2e; }
    .tabs {
      display: flex;
      padding: 0 20px;
      background: #fff;
      border-bottom: 1px solid #e5e5dc;
    }
    .tab {
      padding: 10px 16px;
      font-size: 14px;
      color: #888;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      font-weight: 500;
    }
    .tab.active { color: #1f4f3a; border-bottom-color: #1f4f3a; }
    .task-list { padding: 12px; }
    .task-card {
      background: #fff;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 10px;
      border: 1px solid #e5e5dc;
      cursor: pointer;
      transition: box-shadow .15s;
    }
    .task-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,.06); }
    .task-card.done { opacity: .55; }
    .task-card .deadline {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .task-card .deadline.urgent { color: #d32f2f; }
    .task-card .deadline.warning { color: #e67e22; }
    .task-card .deadline.normal { color: #1f4f3a; }
    .task-card .deadline.past { color: #999; }
    .task-card .content {
      font-size: 13px;
      color: #555;
      line-height: 1.6;
      max-height: 60px;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
    }
    .task-card .note {
      font-size: 14px;
      color: #1a1a1a;
      font-weight: 500;
      margin-top: 4px;
    }
    .task-card .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      font-size: 11px;
      color: #aaa;
    }
    .attachments {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .attachment-btn {
      max-width: 180px;
      padding: 4px 8px;
      border: none;
      border-radius: 4px;
      background: #eef2ea;
      color: #1f4f3a;
      font-size: 12px;
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: left;
    }
    .attachment-btn:hover { background: #dfe8dc; }
    .task-card .actions {
      display: flex;
      gap: 8px;
    }
    .task-card .actions button {
      padding: 3px 10px;
      border: none;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      font-weight: 500;
    }
    .btn-done { background: #e8f5e9; color: #2e7d32; }
    .btn-done:hover { background: #c8e6c9; }
    .btn-delete { background: #fbe9e7; color: #c62828; }
    .btn-delete:hover { background: #ffccbc; }
    .btn-reopen { background: #e3f2fd; color: #1565c0; }
    .btn-reopen:hover { background: #bbdefb; }
    .btn-edit { background: #f0f0e8; color: #555; }
    .btn-edit:hover { background: #e0e0d8; }
    .edit-form {
      display: grid;
      gap: 8px;
    }
    .edit-form label {
      font-size: 11px;
      color: #888;
      font-weight: 600;
    }
    .edit-form textarea,
    .edit-form input {
      width: 100%;
      border: 1px solid #d9ded4;
      border-radius: 6px;
      padding: 8px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      background: #fff;
      color: #1a1a1a;
      user-select: text;
    }
    .edit-form textarea {
      min-height: 64px;
      resize: vertical;
    }
    .edit-form input:focus,
    .edit-form textarea:focus { border-color: #1f4f3a; }
    .edit-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .edit-actions button {
      padding: 6px 14px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 600;
    }
    .edit-actions .btn-secondary { background: #e0e0d8; color: #555; }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #bbb;
    }
    .empty .icon { font-size: 48px; margin-bottom: 12px; }
    .empty p { font-size: 14px; margin-top: 4px; }
    .empty .shortcut { font-size: 12px; color: #ccc; margin-top: 8px; }
    .settings-btn {
      background: none;
      border: 1px solid #d9ded4;
      border-radius: 6px;
      width: 32px; height: 32px;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #888;
    }
    .settings-btn:hover { background: #e8f5e9; color: #1f4f3a; }
    .settings-panel {
      padding: 20px;
      display: none;
    }
    .settings-panel.show { display: block; }
    .settings-panel h3 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 16px;
      color: #1f4f3a;
    }
    .settings-panel label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #666;
      margin-bottom: 4px;
    }
    .settings-panel input {
      width: 100%;
      height: 36px;
      border: 1px solid #d9ded4;
      border-radius: 6px;
      padding: 0 10px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      margin-bottom: 12px;
    }
    .settings-panel input:focus { border-color: #1f4f3a; }
    .settings-save {
      padding: 8px 20px;
      border: none;
      border-radius: 6px;
      background: #1f4f3a;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      font-weight: 600;
    }
    .settings-save:hover { background: #183f2e; }
    .settings-status {
      font-size: 12px;
      color: #2e7d32;
      margin-top: 8px;
      min-height: 18px;
    }
    .update-box {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #e5e5dc;
    }
    .quota-box {
      padding: 14px;
      border: 1px solid #e5e5dc;
      border-radius: 8px;
      background: #fff;
      margin-bottom: 16px;
    }
    .quota-number {
      font-size: 24px;
      color: #1f4f3a;
      font-weight: 800;
      margin-top: 4px;
    }
    .language-control {
      display: flex;
      gap: 4px;
      padding: 3px;
      margin-bottom: 16px;
      border-radius: 6px;
      background: #e9ece4;
    }
    .language-control button {
      flex: 1;
      min-height: 34px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: #666;
      cursor: pointer;
      font-weight: 600;
    }
    .language-control button.active {
      background: #1f4f3a;
      color: #fff;
    }
    .quota-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .quota-actions button {
      flex: 1;
      padding: 7px 10px;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .quota-actions .primary { background: #1f4f3a; color: #fff; }
    .quota-actions .secondary { background: #eef1ea; color: #31513f; }
    .device-id {
      margin-top: 10px;
      color: #777;
      font-size: 11px;
      line-height: 1.5;
      overflow-wrap: anywhere;
      user-select: text;
    }
    .contact-line {
      margin-top: 10px;
      font-size: 13px;
      color: #666;
      line-height: 1.6;
      user-select: text;
    }
    .update-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      font-size: 13px;
      color: #666;
    }
    .update-row strong { color: #1a1a1a; font-weight: 600; }
    .update-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .update-actions button {
      padding: 7px 14px;
      border: none;
      border-radius: 6px;
      background: #1f4f3a;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
      font-weight: 600;
    }
    .update-actions button:disabled {
      background: #d9ded4;
      color: #888;
      cursor: default;
    }
  </style>
</head>
<body>
  <div class="header">
    <div style="display:flex;align-items:baseline;">
      <h1 id="appTitle">记住</h1>
      <span class="count" id="pendingCount"></span>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <button class="settings-btn" id="settingsBtn" onclick="toggleSettings()" title="设置">⚙</button>
      <button class="add-btn" id="addBtn" onclick="openQuickAdd()">+ 新建</button>
    </div>
  </div>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('pending')" id="tab-pending">待办</div>
    <div class="tab" onclick="switchTab('done')" id="tab-done">已完成</div>
  </div>
  <div class="settings-panel" id="settingsPanel">
    <h3 id="settingsTitle">设置</h3>
    <label id="languageLabel">语言</label>
    <div class="language-control">
      <button id="language-system" onclick="setLanguage('system')">跟随系统</button>
      <button id="language-zh" onclick="setLanguage('zh')">中文</button>
      <button id="language-en" onclick="setLanguage('en')">English</button>
    </div>
    <div class="quota-box" id="quotaBox">
      <label id="quotaLabel">智能解析剩余</label>
      <div class="quota-number" id="quotaRemaining">-</div>
      <div class="contact-line" id="contactLine">需要增加智能解析次数，请联系开发者：fusae_js@163.com</div>
      <div class="device-id"><span id="deviceIdLabel">设备ID：</span><span id="deviceId">-</span></div>
      <div class="quota-actions">
        <button class="secondary" id="copyDeviceIdBtn" onclick="copyDeviceId()">复制设备ID</button>
        <button class="primary" id="purchaseBtn" onclick="openPurchase()">增加识别次数</button>
      </div>
    </div>
    <div class="settings-status" id="settingsStatus"></div>
    <div class="update-box">
      <div class="update-row">
        <span id="currentVersionLabel">当前版本</span>
        <strong id="currentVersion">-</strong>
      </div>
      <div class="update-row">
        <span id="updateLabel">更新</span>
        <strong id="updateStatus">未检查</strong>
      </div>
      <div class="update-actions">
        <button id="checkUpdateBtn" onclick="checkForUpdates()">检查更新</button>
        <button id="downloadUpdateBtn" onclick="downloadUpdate()" style="display:none;">下载更新</button>
        <button id="installUpdateBtn" onclick="installUpdate()" style="display:none;">重启安装</button>
      </div>
    </div>
  </div>
  <div class="task-list" id="taskList"></div>

  <script>
    let currentTab = 'pending';
    let settingsVisible = false;
    let taskCache = [];
    let editingTaskId = null;
    let languageMode = 'system';
    let activeLanguage = navigator.language.toLowerCase().startsWith('en') ? 'en' : 'zh';
    const contactEmail = 'fusae_js@163.com';
    const TEXT = {
    en: {
      appName: 'JiZhu',
      settings: 'Settings',
      language: 'Language',
      followSystem: 'System',
      chinese: '中文',
      english: 'English',
      newTask: '+ New',
      pending: 'Todo',
      done: 'Done',
      quotaLabel: 'AI parses left',
      quotaUnit: 'times',
      contact: `Beta version. Contact ${contactEmail} if you need more AI parses.`,
      currentVersion: 'Current version',
      update: 'Update',
      checkUpdate: 'Check for updates',
      downloadUpdate: 'Download update',
      installUpdate: 'Restart to install',
      expired: 'Expired',
      minutesLater: (n) => `${n} min later`,
      hoursLater: (n) => `${n} hr later`,
      today: 'Today',
      tomorrow: 'Tomorrow',
      daysLater: (n) => `${n} days later`,
      noPending: 'No todo tasks',
      noDone: 'No completed tasks',
      shortcut: 'Press Cmd+Shift+T to quick add',
      completed: 'Done',
      restore: 'Restore',
      edit: 'Edit',
      delete: 'Delete',
      save: 'Save',
      cancel: 'Cancel',
      note: 'Note',
      notePlaceholder: 'Short description',
      original: 'Original text',
      deadline: 'Deadline',
      noReminder: 'No reminder',
      justNow: 'Just now',
      minutesAgo: (n) => `${n} min ago`,
      hoursAgo: (n) => `${n} hr ago`,
      daysAgo: (n) => `${n} days ago`,
      unchecked: 'Not checked',
      checking: 'Checking...',
      available: (v) => `Found ${v}`,
      latest: 'Up to date',
      downloading: 'Downloading...',
      downloaded: 'Downloaded, ready to install',
      failed: 'Check failed',
      quotaFailed: 'Failed to load quota',
      deviceId: 'Device ID:',
      copyDeviceId: 'Copy device ID',
      copied: 'Device ID copied',
      addParses: 'Add AI parses',
    },
    zh: {
      appName: '记住',
      settings: '设置',
      language: '语言',
      followSystem: '跟随系统',
      chinese: '中文',
      english: 'English',
      newTask: '+ 新建',
      pending: '待办',
      done: '已完成',
      quotaLabel: '智能解析剩余',
      quotaUnit: '次',
      contact: `当前为内测版本，次数用完后可联系开发者增加智能解析次数：${contactEmail}`,
      currentVersion: '当前版本',
      update: '更新',
      checkUpdate: '检查更新',
      downloadUpdate: '下载更新',
      installUpdate: '重启安装',
      expired: '已过期',
      minutesLater: (n) => `${n} 分钟后`,
      hoursLater: (n) => `${n} 小时后`,
      today: '今天',
      tomorrow: '明天',
      daysLater: (n) => `${n} 天后`,
      noPending: '没有待办任务',
      noDone: '没有已完成的任务',
      shortcut: '按 Cmd+Shift+T 快速添加',
      completed: '已完成',
      restore: '恢复',
      edit: '编辑',
      delete: '删除',
      save: '保存',
      cancel: '取消',
      note: '备注',
      notePlaceholder: '简短描述',
      original: '原文',
      deadline: '截止时间',
      noReminder: '不提醒',
      justNow: '刚刚',
      minutesAgo: (n) => `${n} 分钟前`,
      hoursAgo: (n) => `${n} 小时前`,
      daysAgo: (n) => `${n} 天前`,
      unchecked: '未检查',
      checking: '正在检查...',
      available: (v) => `发现 ${v}`,
      latest: '已是最新',
      downloading: '正在下载...',
      downloaded: '已下载，等待安装',
      failed: '检查失败',
      quotaFailed: '额度读取失败',
      deviceId: '设备ID：',
      copyDeviceId: '复制设备ID',
      copied: '设备ID已复制',
      addParses: '增加识别次数',
    }};
    let L = TEXT[activeLanguage];

    function applyI18n() {
      activeLanguage = languageMode === 'system'
        ? (navigator.language.toLowerCase().startsWith('en') ? 'en' : 'zh')
        : languageMode;
      L = TEXT[activeLanguage];
      document.documentElement.lang = activeLanguage === 'en' ? 'en' : 'zh-CN';
      document.title = L.appName;
      document.getElementById('appTitle').textContent = L.appName;
      document.getElementById('settingsBtn').title = L.settings;
      document.getElementById('addBtn').textContent = L.newTask;
      document.getElementById('tab-pending').textContent = L.pending;
      document.getElementById('tab-done').textContent = L.done;
      document.getElementById('settingsTitle').textContent = L.settings;
      document.getElementById('languageLabel').textContent = L.language;
      document.getElementById('language-system').textContent = L.followSystem;
      document.getElementById('language-zh').textContent = L.chinese;
      document.getElementById('language-en').textContent = L.english;
      for (const mode of ['system', 'zh', 'en']) {
        document.getElementById(`language-${mode}`).classList.toggle('active', languageMode === mode);
      }
      document.getElementById('quotaLabel').textContent = L.quotaLabel;
      document.getElementById('contactLine').textContent = L.contact;
      document.getElementById('deviceIdLabel').textContent = L.deviceId;
      document.getElementById('copyDeviceIdBtn').textContent = L.copyDeviceId;
      document.getElementById('purchaseBtn').textContent = L.addParses;
      document.getElementById('currentVersionLabel').textContent = L.currentVersion;
      document.getElementById('updateLabel').textContent = L.update;
      document.getElementById('checkUpdateBtn').textContent = L.checkUpdate;
      document.getElementById('downloadUpdateBtn').textContent = L.downloadUpdate;
      document.getElementById('installUpdateBtn').textContent = L.installUpdate;
      document.getElementById('updateStatus').textContent = L.unchecked;
      renderTasks(taskCache);
    }

    async function loadTasks() {
      const pending = await window.api.tasks.listPending();
      const count = pending.length;
      document.getElementById('pendingCount').textContent = count > 0 ? `(${count})` : '';

      const tasks = currentTab === 'done'
        ? await window.api.tasks.listCompleted()
        : pending;

      taskCache = tasks;
      renderTasks(tasks);
    }

    function deadlineLabel(iso) {
      if (!iso) return { text: L.noReminder, cls: 'past' };
      const d = new Date(iso);
      const now = new Date();
      const diff = d.getTime() - now.getTime();
      const minutes = Math.round(diff / (1000 * 60));
      const hours = Math.round(diff / (1000 * 60 * 60));
      const days = Math.round(diff / (1000 * 60 * 60 * 24));

      const month = d.getMonth() + 1;
      const day = d.getDate();
      const hour = String(d.getHours()).padStart(2, '0');
      const min = String(d.getMinutes()).padStart(2, '0');
      const dateStr = `${month}/${day} ${hour}:${min}`;

      if (diff < 0) return { text: `${L.expired} · ${dateStr}`, cls: 'past' };
      if (minutes <= 15) return { text: `${L.minutesLater(minutes)} · ${dateStr}`, cls: 'urgent' };
      if (hours <= 1) return { text: `${L.minutesLater(minutes)} · ${dateStr}`, cls: 'urgent' };
      if (hours <= 6) return { text: `${L.hoursLater(hours)} · ${dateStr}`, cls: 'warning' };
      if (days === 0) return { text: `${L.today} ${hour}:${min}`, cls: 'normal' };
      if (days === 1) return { text: `${L.tomorrow} ${hour}:${min}`, cls: 'normal' };
      if (days <= 3) return { text: `${L.daysLater(days)} · ${dateStr}`, cls: 'normal' };
      return { text: dateStr, cls: 'normal' };
    }

    function renderTasks(tasks) {
      const container = document.getElementById('taskList');
      if (!tasks.length) {
        const isPending = currentTab === 'pending';
        container.innerHTML = `
          <div class="empty">
            <div class="icon">${isPending ? '📋' : '✅'}</div>
            <p>${isPending ? L.noPending : L.noDone}</p>
            <p class="shortcut">${isPending ? L.shortcut : ''}</p>
          </div>`;
        return;
      }

      container.innerHTML = tasks.map(t => {
        if (editingTaskId === t.id) return renderEditForm(t);
        const dl = deadlineLabel(t.deadline);
        const isDone = !!t.completed_at;
        return `
          <div class="task-card ${isDone ? 'done' : ''}">
            <div class="deadline ${dl.cls}">${isDone ? `✅ ${L.completed}` : dl.text}</div>
            ${t.note ? `<div class="note">${escapeHtml(t.note)}</div>` : ''}
            <div class="content">${escapeHtml(t.content)}</div>
            ${renderAttachments(t.attachments)}
            <div class="meta">
              <span>${timeAgo(t.created_at)}</span>
              <div class="actions">
                ${isDone
                  ? `<button class="btn-reopen" onclick="reopenTask('${t.id}')">${L.restore}</button>
                     <button class="btn-edit" onclick="editTask('${t.id}')">${L.edit}</button>
                     <button class="btn-delete" onclick="deleteTask('${t.id}')">${L.delete}</button>`
                  : `<button class="btn-done" onclick="completeTask('${t.id}')">${L.completed}</button>
                     <button class="btn-edit" onclick="editTask('${t.id}')">${L.edit}</button>
                     <button class="btn-delete" onclick="deleteTask('${t.id}')">${L.delete}</button>`}
              </div>
            </div>
          </div>`;
      }).join('');
    }

    function renderEditForm(task) {
      return `
        <div class="task-card">
          <div class="edit-form">
            <label>${L.note}</label>
            <input id="edit-note-${task.id}" value="${escapeHtml(task.note || '')}" placeholder="${L.notePlaceholder}">
            <label>${L.original}</label>
            <textarea id="edit-content-${task.id}">${escapeHtml(task.content || '')}</textarea>
            <label>${L.deadline}</label>
            <input id="edit-deadline-${task.id}" type="datetime-local" value="${formatDateTimeInput(task.deadline)}">
            ${renderAttachments(task.attachments)}
            <div class="edit-actions">
              <button class="btn-secondary task-edit-btn" onclick="cancelEdit()">${L.cancel}</button>
              <button class="btn-done task-edit-btn" onclick="saveTask('${task.id}')">${L.save}</button>
            </div>
          </div>
        </div>`;
    }

    function formatDateTimeInput(iso) {
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return '';
      const pad = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function renderAttachments(attachments) {
      if (!attachments || attachments.length === 0) return '';
      return `<div class="attachments">${attachments.map((file) =>
        `<button class="attachment-btn" data-path="${escapeHtml(file.path)}" onclick="openAttachment(this)" title="${escapeHtml(file.path)}">📎 ${escapeHtml(file.name)}</button>`
      ).join('')}</div>`;
    }

    async function openAttachment(button) {
      const error = await window.api.attachments.open(button.dataset.path);
      if (error) alert(error);
    }

    function timeAgo(iso) {
      const diff = Date.now() - new Date(iso).getTime();
      const mins = Math.round(diff / 60000);
      if (mins < 1) return L.justNow;
      if (mins < 60) return L.minutesAgo(mins);
      const hours = Math.round(mins / 60);
      if (hours < 24) return L.hoursAgo(hours);
      return L.daysAgo(Math.round(hours / 24));
    }

    function escapeHtml(s) {
      return String(s || '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tab-pending').classList.toggle('active', tab === 'pending');
      document.getElementById('tab-done').classList.toggle('active', tab === 'done');
      loadTasks();
    }

    async function completeTask(id) {
      await window.api.tasks.complete(id);
      loadTasks();
    }

    async function reopenTask(id) {
      await window.api.tasks.reopen(id);
      loadTasks();
    }

    async function deleteTask(id) {
      await window.api.tasks.delete(id);
      loadTasks();
    }

    function editTask(id) {
      editingTaskId = id;
      renderTasks(taskCache);
    }

    function cancelEdit() {
      editingTaskId = null;
      renderTasks(taskCache);
    }

    async function saveTask(id) {
      const content = document.getElementById(`edit-content-${id}`).value.trim();
      const note = document.getElementById(`edit-note-${id}`).value.trim();
      const deadlineValue = document.getElementById(`edit-deadline-${id}`).value;
      if (!content) return;

      await window.api.tasks.update(id, {
        content,
        note,
        deadline: deadlineValue ? new Date(deadlineValue).toISOString() : '',
      });
      editingTaskId = null;
      loadTasks();
    }

    function openQuickAdd() {
      window.api.window.openQuickAdd();
    }

    // Listen for new tasks added from quick-add
    window.api.tasks.onTaskAdded(() => {
      if (currentTab !== 'done') loadTasks();
    });

    setInterval(() => {
      if (!settingsVisible) loadTasks();
    }, 30_000);

    // Settings
    async function toggleSettings() {
      settingsVisible = !settingsVisible;
      const panel = document.getElementById('settingsPanel');
      const taskList = document.getElementById('taskList');
      if (settingsVisible) {
        panel.classList.add('show');
        taskList.style.display = 'none';
        loadQuota();
        loadDeviceId();
        loadUpdateStatus();
      } else {
        panel.classList.remove('show');
        taskList.style.display = '';
      }
    }

    async function loadQuota() {
      try {
        const quota = await window.api.quota.get();
        document.getElementById('quotaRemaining').textContent = `${quota.remaining} ${L.quotaUnit}`;
        document.getElementById('quotaLabel').style.display = quota.purchased > 0 && quota.remaining > 10 ? 'none' : '';
        document.getElementById('quotaRemaining').style.display = quota.purchased > 0 && quota.remaining > 10 ? 'none' : '';
      } catch (err) {
        document.getElementById('settingsStatus').textContent = err.message || L.quotaFailed;
      }
    }

    async function loadDeviceId() {
      document.getElementById('deviceId').textContent = await window.api.app.getDeviceId();
    }

    async function copyDeviceId() {
      const deviceId = document.getElementById('deviceId').textContent;
      if (!deviceId || deviceId === '-') return;
      await window.api.clipboard.write(deviceId);
      document.getElementById('settingsStatus').textContent = L.copied;
    }

    function openPurchase() {
      window.api.purchase.open();
    }

    async function setLanguage(mode) {
      languageMode = mode;
      await window.api.app.setLanguage(mode);
      applyI18n();
      loadQuota();
      loadUpdateStatus();
    }
    async function loadUpdateStatus() {
      document.getElementById('currentVersion').textContent = await window.api.app.getVersion();
      renderUpdateStatus(await window.api.updates.getStatus());
    }

    function renderUpdateStatus(state) {
      const status = document.getElementById('updateStatus');
      const checkBtn = document.getElementById('checkUpdateBtn');
      const downloadBtn = document.getElementById('downloadUpdateBtn');
      const installBtn = document.getElementById('installUpdateBtn');

      checkBtn.disabled = state.status === 'checking' || state.status === 'downloading';
      downloadBtn.style.display = state.status === 'available' ? '' : 'none';
      installBtn.style.display = state.status === 'downloaded' ? '' : 'none';

      if (state.status === 'idle') status.textContent = L.unchecked;
      else if (state.status === 'checking') status.textContent = L.checking;
      else if (state.status === 'available') status.textContent = L.available(state.latestVersion);
      else if (state.status === 'not-available') status.textContent = L.latest;
      else if (state.status === 'downloading') status.textContent = state.message || L.downloading;
      else if (state.status === 'downloaded') status.textContent = L.downloaded;
      else status.textContent = state.message || L.failed;
    }

    async function checkForUpdates() {
      renderUpdateStatus({ status: 'checking' });
      renderUpdateStatus(await window.api.updates.check());
    }

    async function downloadUpdate() {
      renderUpdateStatus({ status: 'downloading', message: L.downloading });
      await window.api.updates.download();
    }

    function installUpdate() {
      window.api.updates.install();
    }

    (async () => {
      languageMode = await window.api.settings.get('languageMode') || 'system';
      applyI18n();
      loadTasks();
    })();
    window.api.app.onLanguageChanged((mode) => {
      languageMode = mode;
      applyI18n();
    });
    window.api.updates.onStatus(renderUpdateStatus);
  </script>
</body>
</html>
