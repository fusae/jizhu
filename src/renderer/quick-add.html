<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Quick Add</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f5f0;
      color: #1a1a1a;
      padding: 0;
      -webkit-app-region: drag;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .titlebar {
      padding: 8px 12px;
      background: #1f4f3a;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      -webkit-app-region: drag;
    }
    .form {
      padding: 16px 20px;
      -webkit-app-region: no-drag;
      flex: 1;
      overflow: auto;
      padding-bottom: 76px;
    }
    textarea {
      width: 100%;
      height: 80px;
      border: 1px solid #d9ded4;
      border-radius: 6px;
      padding: 10px;
      font-size: 13px;
      font-family: inherit;
      resize: none;
      outline: none;
      color: #555;
      background: #fff;
    }
    textarea:focus { border-color: #1f4f3a; }
    .field {
      margin-top: 12px;
    }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #666;
      margin-bottom: 4px;
    }
    .field input {
      width: 100%;
      height: 36px;
      border: 1px solid #d9ded4;
      border-radius: 6px;
      padding: 0 10px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      background: #fff;
    }
    .field input:focus { border-color: #1f4f3a; }
    .quick-times {
      display: flex;
      gap: 6px;
      margin-top: 6px;
      flex-wrap: wrap;
    }
    .deadline-controls {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px;
      margin-top: 6px;
    }
    .quick-time {
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid #d9ded4;
      background: #fff;
      font-size: 12px;
      cursor: pointer;
      font-weight: 500;
    }
    .quick-time:hover { background: #e8f5e9; border-color: #1f4f3a; }
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 0;
      justify-content: flex-end;
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 12px 20px;
      background: #f5f5f0;
      border-top: 1px solid #e5e5dc;
      z-index: 20;
    }
    .btn {
      padding: 8px 20px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary { background: #1f4f3a; color: #fff; }
    .btn-primary:hover { background: #183f2e; }
    .btn-secondary { background: #e0e0d8; color: #555; }
    .btn-secondary:hover { background: #d0d0c8; }
    .preview {
      font-size: 11px;
      color: #888;
      margin-top: 6px;
      min-height: 16px;
    }
    .drop-zone {
      min-height: 44px;
      border: 1px dashed #cbd5c7;
      border-radius: 6px;
      background: #fff;
      color: #888;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 6px;
      transition: background .15s, border-color .15s, color .15s;
    }
    .drop-zone.dragging {
      background: #e8f5e9;
      border-color: #1f4f3a;
      color: #1f4f3a;
    }
    .file-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
      max-height: 54px;
      overflow: auto;
    }
    .file-chip {
      max-width: 180px;
      padding: 4px 8px;
      border-radius: 4px;
      background: #eef2ea;
      color: #1f4f3a;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .file-chip span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .file-chip button {
      border: none;
      background: none;
      color: #888;
      cursor: pointer;
      font-size: 13px;
      line-height: 1;
    }
    .ai-hint {
      font-size: 12px;
      color: #1f4f3a;
      margin-top: 6px;
      min-height: 18px;
      font-weight: 500;
    }
    .ai-hint.loading { color: #888; font-style: italic; }
  </style>
</head>
<body>
  <div class="titlebar" id="titlebar">快速添加备忘</div>
  <div class="form">
    <textarea id="content" placeholder="粘贴微信聊天内容，AI 会自动提取要点..."></textarea>
    <div id="aiHint" class="ai-hint"></div>
    <div class="field">
      <label id="noteLabel">备注（可选）</label>
      <input id="note" placeholder="简短描述，如：出稿子">
    </div>
    <div class="field">
      <label id="deadlineLabel">截止时间</label>
      <input id="deadline" placeholder="如：明天下午6点、周五、下周三">
      <div class="deadline-controls">
        <input id="deadlinePicker" type="datetime-local">
        <button class="quick-time" id="clearDeadlineBtn" onclick="clearDeadline()">清除时间</button>
      </div>
      <div class="quick-times">
        <button class="quick-time" onclick="setQuick('今天 18:00')">今天 18:00</button>
        <button class="quick-time" onclick="setQuick('明天 18:00')">明天 18:00</button>
        <button class="quick-time" onclick="setQuick('本周五 18:00')">本周五</button>
        <button class="quick-time" onclick="setQuick('下周一 09:00')">下周一</button>
      </div>
    </div>
    <div class="preview" id="preview"></div>
    <div class="field">
      <label id="attachmentsLabel">附件（可选）</label>
      <div class="drop-zone" id="dropZone">把文件拖到这里</div>
      <div class="file-list" id="fileList"></div>
    </div>
    <div class="actions">
      <button class="btn btn-secondary" id="cancelBtn" onclick="closeWindow()">取消</button>
      <button class="btn btn-primary" id="saveBtn" onclick="submitTask()">保存</button>
    </div>
  </div>

  <script>
    let aiParsing = false;
    let debounceTimer = null;
    let selectedAttachments = [];
    let parsedTasks = [];
    let languageMode = 'system';
    let isEn = navigator.language.toLowerCase().startsWith('en');
    const contactEmail = 'fusae_js@163.com';
    const TEXT = {
    en: {
      title: 'Quick Add',
      titlebar: 'Quick Add Reminder',
      contentPlaceholder: 'Paste a chat message. AI will extract tasks automatically...',
      note: 'Note (optional)',
      notePlaceholder: 'Short description, e.g. report draft',
      deadline: 'Deadline',
      deadlinePlaceholder: 'e.g. tomorrow 6 PM, Friday, next Wednesday',
      clearDeadline: 'Clear time',
      today: 'Today 18:00',
      tomorrow: 'Tomorrow 18:00',
      friday: 'Friday',
      monday: 'Next Monday',
      attachments: 'Attachments (optional)',
      dropZone: 'Drag files here',
      cancel: 'Cancel',
      save: 'Save',
      aiLoading: 'AI recognizing...',
      quotaUsed: `AI parses are used up. This is a beta version. Contact ${contactEmail} if you need more AI parses.`,
      manyTasks: (count) => `AI recognized ${count} tasks. Saving will create all of them.`,
      aiFilled: 'AI filled the fields. Confirm or edit.',
      aiFailed: 'AI recognition failed. Fill in manually.',
      noContent: 'Please enter task content',
      defaultNote: 'Task',
      previewLocale: 'en-US',
    },
    zh: {
      title: '快速添加',
      titlebar: '快速添加备忘',
      contentPlaceholder: '粘贴微信聊天内容，AI 会自动提取要点...',
      note: '备注（可选）',
      notePlaceholder: '简短描述，如：出稿子',
      deadline: '截止时间',
      deadlinePlaceholder: '如：明天下午6点、周五、下周三',
      clearDeadline: '清除时间',
      today: '今天 18:00',
      tomorrow: '明天 18:00',
      friday: '本周五',
      monday: '下周一',
      attachments: '附件（可选）',
      dropZone: '把文件拖到这里',
      cancel: '取消',
      save: '保存',
      aiLoading: 'AI 识别中...',
      quotaUsed: `智能解析次数已用完。当前为内测版本，如需增加次数，请联系开发者：${contactEmail}`,
      manyTasks: (count) => `AI 已识别 ${count} 个任务，保存时会全部创建`,
      aiFilled: 'AI 已自动填写，确认或修改即可',
      aiFailed: 'AI 识别失败，请手动填写',
      noContent: '请输入任务内容',
      defaultNote: '任务',
      previewLocale: 'zh-CN',
    }};
    let L = isEn ? TEXT.en : TEXT.zh;

    function applyI18n() {
      isEn = languageMode === 'en' || (languageMode === 'system' && navigator.language.toLowerCase().startsWith('en'));
      L = isEn ? TEXT.en : TEXT.zh;
      document.documentElement.lang = isEn ? 'en' : 'zh-CN';
      document.title = L.title;
      document.getElementById('titlebar').textContent = L.titlebar;
      document.getElementById('content').placeholder = L.contentPlaceholder;
      document.getElementById('noteLabel').textContent = L.note;
      document.getElementById('note').placeholder = L.notePlaceholder;
      document.getElementById('deadlineLabel').textContent = L.deadline;
      document.getElementById('deadline').placeholder = L.deadlinePlaceholder;
      document.getElementById('clearDeadlineBtn').textContent = L.clearDeadline;
      document.getElementById('attachmentsLabel').textContent = L.attachments;
      document.getElementById('dropZone').textContent = L.dropZone;
      document.getElementById('cancelBtn').textContent = L.cancel;
      document.getElementById('saveBtn').textContent = L.save;
      const quickButtons = document.querySelectorAll('.quick-times .quick-time');
      quickButtons[0].textContent = L.today;
      quickButtons[1].textContent = L.tomorrow;
      quickButtons[2].textContent = L.friday;
      quickButtons[3].textContent = L.monday;
      if (isEn) {
        quickButtons[0].onclick = () => setQuick('Today 18:00');
        quickButtons[1].onclick = () => setQuick('Tomorrow 18:00');
        quickButtons[2].onclick = () => setQuick('Friday 18:00');
        quickButtons[3].onclick = () => setQuick('Next Monday 09:00');
      } else {
        quickButtons[0].onclick = () => setQuick('今天 18:00');
        quickButtons[1].onclick = () => setQuick('明天 18:00');
        quickButtons[2].onclick = () => setQuick('本周五 18:00');
        quickButtons[3].onclick = () => setQuick('下周一 09:00');
      }
    }

    (async () => {
      languageMode = await window.api.settings.get('languageMode') || 'system';
      applyI18n();
      const text = await window.api.clipboard.read();
      if (text) {
        document.getElementById('content').value = text;
        runAiParse(text);
      }
    })();
    window.api.app.onLanguageChanged((mode) => {
      languageMode = mode;
      applyI18n();
    });

    async function runAiParse(text) {
      if (!text || text.length < 10) return;
      aiParsing = true;
      const hint = document.getElementById('aiHint');
      hint.textContent = L.aiLoading;
      hint.className = 'ai-hint loading';

      try {
        const timeoutPromise = new Promise((_, reject) =>
          setTimeout(() => reject(new Error('timeout')), 12000)
        );
        const result = await Promise.race([
          window.api.aiParse(text),
          timeoutPromise
        ]);

        if (result && result.error) {
          hint.textContent = result.error === '免费次数已用完' ? L.quotaUsed : localizeError(result.error);
          hint.className = 'ai-hint';
          return;
        }
        if (result && Array.isArray(result.tasks) && result.tasks.length > 0) {
          parsedTasks = result.tasks;
        }
        if (result && (result.note || result.deadline)) {
          if (result.note) document.getElementById('note').value = result.note;
          if (result.deadline) {
            document.getElementById('deadline').value = result.deadline;
            updatePreview();
          }
          hint.textContent = parsedTasks.length > 1 ? L.manyTasks(parsedTasks.length) : L.aiFilled;
          hint.className = 'ai-hint';
        } else {
          hint.textContent = '';
          hint.className = 'ai-hint';
        }
      } catch (err) {
        console.error('AI parse error:', err);
        hint.textContent = L.aiFailed;
        hint.className = 'ai-hint';
        setTimeout(() => {
          hint.textContent = '';
        }, 3000);
      }
      aiParsing = false;
    }

    document.getElementById('content').addEventListener('input', function() {
      const text = this.value;
      if (text.length < 10) return;

      // 清除之前的定时器
      if (debounceTimer) clearTimeout(debounceTimer);

      // 2秒后自动重新识别
      debounceTimer = setTimeout(() => {
        if (!aiParsing) {
          runAiParse(text);
        }
      }, 2000);
    });

    function setQuick(time) {
      document.getElementById('deadline').value = time;
      document.getElementById('deadlinePicker').value = '';
      updatePreview();
    }

    function clearDeadline() {
      document.getElementById('deadline').value = '';
      document.getElementById('deadlinePicker').value = '';
      document.getElementById('preview').textContent = '';
    }

    async function updatePreview() {
      const text = document.getElementById('deadline').value.trim();
      if (!text) { document.getElementById('preview').textContent = ''; return; }
      const iso = await window.api.parseDeadline(text);
      if (iso) {
        document.getElementById('preview').textContent = '→ ' + new Date(iso).toLocaleString(L.previewLocale, {
          month: 'numeric', day: 'numeric',
          hour: '2-digit', minute: '2-digit',
          weekday: 'short',
        });
      } else {
        document.getElementById('preview').textContent = '';
      }
    }

    document.getElementById('deadline').addEventListener('input', updatePreview);
    document.getElementById('deadlinePicker').addEventListener('change', function() {
      if (!this.value) return;
      document.getElementById('deadline').value = this.value.replace('T', ' ');
      updatePreview();
    });

    async function submitTask() {
      const content = document.getElementById('content').value.trim();
      if (!content) {
        alert(L.noContent);
        return;
      }

      const note = document.getElementById('note').value.trim();
      const deadlineText = document.getElementById('deadline').value.trim();
      if (parsedTasks.length > 1) {
        const tasks = [];
        for (const task of parsedTasks) {
          const parsedDeadline = task.deadline ? await window.api.parseDeadline(task.deadline) : null;
          tasks.push({
            content: task.content || content,
            note: task.note || '',
            deadline: parsedDeadline || '',
            attachments: selectedAttachments,
          });
        }
        await window.api.window.submitQuickAdd({ content, note, deadline: tasks[0].deadline, attachments: selectedAttachments, tasks });
        return;
      }

      let deadline = null;

      if (deadlineText) {
        deadline = await window.api.parseDeadline(deadlineText);
      }

      await window.api.window.submitQuickAdd({ content, note, deadline: deadline || '', attachments: selectedAttachments });
    }

    function localizeError(message) {
      if (!isEn) return message;
      if (message.includes('请求失败')) return 'Request failed';
      if (message.includes('AI 解析失败')) return 'AI parsing failed';
      return message;
    }

    function addAttachments(paths) {
      for (const path of paths || []) {
        if (path && !selectedAttachments.includes(path)) selectedAttachments.push(path);
      }
      renderFiles();
    }

    function removeAttachment(index) {
      selectedAttachments.splice(index, 1);
      renderFiles();
    }

    function renderFiles() {
      const list = document.getElementById('fileList');
      list.innerHTML = selectedAttachments.map((path, index) => {
        const name = path.split(/[\\/]/).pop() || path;
        return `<div class="file-chip" title="${escapeHtml(path)}"><span>${escapeHtml(name)}</span><button onclick="removeAttachment(${index})">×</button></div>`;
      }).join('');
    }

    function escapeHtml(s) {
      return String(s || '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function closeWindow() {
      window.api.window.closeQuickAdd();
    }

    // Submit on Cmd+Enter
    document.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
        submitTask();
      }
      if (e.key === 'Escape') {
        closeWindow();
      }
    });

    document.addEventListener('dragover', (e) => {
      e.preventDefault();
      document.getElementById('dropZone').classList.add('dragging');
    });

    document.addEventListener('dragleave', (e) => {
      if (e.clientX <= 0 || e.clientY <= 0 || e.clientX >= window.innerWidth || e.clientY >= window.innerHeight) {
        document.getElementById('dropZone').classList.remove('dragging');
      }
    });

    document.addEventListener('drop', (e) => {
      e.preventDefault();
      document.getElementById('dropZone').classList.remove('dragging');
      addAttachments(Array.from(e.dataTransfer.files || []).map((file) => file.path).filter(Boolean));
    });
  </script>
</body>
</html>
