<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>快速添加</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f5f0;
      color: #1a1a1a;
      padding: 0;
      -webkit-app-region: drag;
    }
    .titlebar {
      padding: 8px 12px;
      background: #1f4f3a;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      -webkit-app-region: drag;
    }
    .form {
      padding: 16px 20px;
      -webkit-app-region: no-drag;
    }
    textarea {
      width: 100%;
      height: 80px;
      border: 1px solid #d9ded4;
      border-radius: 6px;
      padding: 10px;
      font-size: 13px;
      font-family: inherit;
      resize: none;
      outline: none;
      color: #555;
      background: #fff;
    }
    textarea:focus { border-color: #1f4f3a; }
    .field {
      margin-top: 12px;
    }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #666;
      margin-bottom: 4px;
    }
    .field input {
      width: 100%;
      height: 36px;
      border: 1px solid #d9ded4;
      border-radius: 6px;
      padding: 0 10px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      background: #fff;
    }
    .field input:focus { border-color: #1f4f3a; }
    .quick-times {
      display: flex;
      gap: 6px;
      margin-top: 6px;
      flex-wrap: wrap;
    }
    .quick-time {
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid #d9ded4;
      background: #fff;
      font-size: 12px;
      cursor: pointer;
      font-weight: 500;
    }
    .quick-time:hover { background: #e8f5e9; border-color: #1f4f3a; }
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      justify-content: flex-end;
    }
    .btn {
      padding: 8px 20px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary { background: #1f4f3a; color: #fff; }
    .btn-primary:hover { background: #183f2e; }
    .btn-secondary { background: #e0e0d8; color: #555; }
    .btn-secondary:hover { background: #d0d0c8; }
    .preview {
      font-size: 11px;
      color: #888;
      margin-top: 6px;
      min-height: 16px;
    }
    .ai-hint {
      font-size: 12px;
      color: #1f4f3a;
      margin-top: 6px;
      min-height: 18px;
      font-weight: 500;
    }
    .ai-hint.loading { color: #888; font-style: italic; }
  </style>
</head>
<body>
  <div class="titlebar">快速添加备忘</div>
  <div class="form">
    <textarea id="content" placeholder="粘贴微信聊天内容，AI 会自动提取要点..."></textarea>
    <div id="aiHint" class="ai-hint"></div>
    <div class="field">
      <label>备注（可选）</label>
      <input id="note" placeholder="简短描述，如：出稿子">
    </div>
    <div class="field">
      <label>截止时间</label>
      <input id="deadline" placeholder="如：明天下午6点、周五、下周三">
      <div class="quick-times">
        <button class="quick-time" onclick="setQuick('今天 18:00')">今天 18:00</button>
        <button class="quick-time" onclick="setQuick('明天 18:00')">明天 18:00</button>
        <button class="quick-time" onclick="setQuick('本周五 18:00')">本周五</button>
        <button class="quick-time" onclick="setQuick('下周一 09:00')">下周一</button>
      </div>
    </div>
    <div class="preview" id="preview"></div>
    <div class="actions">
      <button class="btn btn-secondary" onclick="closeWindow()">取消</button>
      <button class="btn btn-primary" onclick="submitTask()">保存</button>
    </div>
  </div>

  <script>
    let aiParsing = false;

    (async () => {
      const text = await window.api.clipboard.read();
      if (text) {
        document.getElementById('content').value = text;
        runAiParse(text);
      }
    })();

    async function runAiParse(text) {
      if (!text || text.length < 10) return;
      aiParsing = true;
      const hint = document.getElementById('aiHint');
      hint.textContent = 'AI 识别中...';
      hint.className = 'ai-hint loading';

      const result = await window.api.aiParse(text);
      if (result && (result.note || result.deadline)) {
        if (result.note) document.getElementById('note').value = result.note;
        if (result.deadline) {
          document.getElementById('deadline').value = result.deadline;
          updatePreview();
        }
        hint.textContent = 'AI 已自动填写，确认或修改即可';
        hint.className = 'ai-hint';
      } else {
        hint.textContent = '';
        hint.className = 'ai-hint';
      }
      aiParsing = false;
    }

    document.getElementById('content').addEventListener('input', function() {
      if (!aiParsing && this.value.length > 20) {
        runAiParse(this.value);
      }
    });

    function setQuick(time) {
      document.getElementById('deadline').value = time;
      updatePreview();
    }

    async function updatePreview() {
      const text = document.getElementById('deadline').value.trim();
      if (!text) { document.getElementById('preview').textContent = ''; return; }
      const iso = await window.api.parseDeadline(text);
      if (iso) {
        document.getElementById('preview').textContent = '→ ' + new Date(iso).toLocaleString('zh-CN', {
          month: 'numeric', day: 'numeric',
          hour: '2-digit', minute: '2-digit',
          weekday: 'short',
        });
      } else {
        document.getElementById('preview').textContent = '';
      }
    }

    document.getElementById('deadline').addEventListener('input', updatePreview);

    async function submitTask() {
      const content = document.getElementById('content').value.trim();
      if (!content) return;

      const note = document.getElementById('note').value.trim();
      const deadlineText = document.getElementById('deadline').value.trim();
      let deadline = null;

      if (deadlineText) {
        deadline = await window.api.parseDeadline(deadlineText);
      }

      if (!deadline) {
        deadline = new Date(Date.now() + 24 * 60 * 60 * 1000).toISOString();
      }

      await window.api.window.submitQuickAdd({ content, note, deadline });
    }

    function closeWindow() {
      window.api.window.closeQuickAdd();
    }

    // Submit on Cmd+Enter
    document.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
        submitTask();
      }
      if (e.key === 'Escape') {
        closeWindow();
      }
    });
  </script>
</body>
</html>
